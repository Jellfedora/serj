[package]
name = "serj"
version = "0.2.1"
edition = "2024"
description = "Lecteur de BD en PDF, case par case"
repository = "https://github.com/Jellfedora/serj"

[dependencies]
directories = "6"
eframe = { version = "0.36", default-features = false, features = ["wgpu", "default_fonts", "wayland", "x11"] }
egui = "0.36"
hayro = "0.8"
image = { version = "0.25", default-features = false, features = ["png"] }
rfd = "0.17"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
lto = "thin"
strip = true
