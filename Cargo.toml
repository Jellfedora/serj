[package]
name = "serj"
version = "0.4.0"
edition = "2024"
description = "Lecteur de BD en PDF. Une case à la fois."
repository = "https://github.com/Jellfedora/serj"

[dependencies]
anyhow = "1"
directories = "6"
eframe = { version = "0.36", default-features = false, features = ["wgpu", "default_fonts", "links", "wayland", "x11"] }
egui = "0.36"
flate2 = "1"
hayro = "0.8"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
regex = "1"
rfd = "0.17"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
tar = "0.4"
unicode-normalization = "0.1"
ureq = { version = "3", features = ["json"] }

[profile.release]
lto = "thin"
strip = true

[target."cfg(windows)".dependencies]
zip = { version = "8", default-features = false, features = ["deflate"] }

[target.'cfg(not(target_os = "macos"))'.dependencies]
self-replace = "1"
