[package]
name = "serj"
version = "0.1.0"
edition = "2024"

[dependencies]
directories = "6"
eframe = { version = "0.36", default-features = false, features = ["wgpu", "default_fonts"] }
egui = "0.36"
hayro = "0.8"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
rfd = "0.17"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
